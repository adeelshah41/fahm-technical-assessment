version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend/app/models:/app/app/models
    environment:
      - ENV=development

  frontend:
    build: 
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8080
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend
